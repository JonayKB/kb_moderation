modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# Needed on both sides: the client draws the moderation screens and overlays.
displayTest="MATCH_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: staff permissions come from its Discord role tags, and bans also cover the Discord account.
[[dependencies.${mod_id}]]
    modId="kb_discord_auth"
    mandatory=false
    versionRange="[1.9,)"
    ordering="AFTER"
    side="BOTH"
